name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Install Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run all tests
        run: python -m pytest --junitxml=test-results/pytest.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.run_number }}
          path: |
            test-results/
            tests/member_a/screenshots/
            tests/member_b/screenshots/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package tested project
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create deployment-ready archive
        run: >-
          tar --create --gzip
          --exclude='.DS_Store'
          --exclude='__pycache__'
          --exclude='*.pyc'
          --file opencart-system-tests-${{ github.sha }}.tar.gz
          README.md requirements.txt pytest.ini tests

      - name: Upload packaged project
        uses: actions/upload-artifact@v7
        with:
          name: tested-project-${{ github.sha }}
          path: opencart-system-tests-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
